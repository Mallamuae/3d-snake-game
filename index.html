<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Snake Game</title>
    <style>
        /* Basic reset and layout for full‑screen rendering */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            font-family: sans-serif;
            background-color: #000;
        }
        /* Overlay to display score and status messages */
        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            color: #ffffff;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 32px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 6px;
            display: none;
        }

        /* Canvas element spans full screen behind overlays */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }
        /* Button to restart the game after game over */
        #restartBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
        }
        #restartBtn:hover {
            background-color: #45a049;
        }
    </style>
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json" />
</head>
<body>
    <!-- Overlay for current score and speed indicator -->
    <div id="overlay">Score: <span id="score">0</span> &nbsp;|&nbsp; Speed: <span id="speed">1x</span></div>
    <!-- Game over screen -->
    <div id="gameover">
        <div id="gameoverText">Game Over</div>
        <button id="restartBtn">Restart</button>
    </div>
    <!-- Main game logic (uses pure Canvas 2D, no external dependencies) -->
    <script src="game.js"></script>
    <!-- Register service worker for PWA functionality -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (error) {
                    console.warn('Service worker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
